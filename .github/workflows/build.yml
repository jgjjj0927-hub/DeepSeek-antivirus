name: Build KiwiLab X00Team

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: onefile
          enable-plugins: tk-inter
          include-package: customtkinter
          include-data-dir: assets=assets
          windows-console-mode: disable
          windows-icon-from-ico: assets/logo.ico
          output-file: KiwiLabX00Team.exe
          company-name: X00Team
          product-name: KiwiLab X00Team
          file-version: 1.0.0.0
          product-version: 1.0.0.0

      - name: Verify output exists
        run: |
          if not exist build\KiwiLabX00Team.exe (
            echo ERROR: build\KiwiLabX00Team.exe not found
            dir build
            exit /b 1
          )
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiwiLab-Windows
          path: build/KiwiLabX00Team.exe
          include-hidden-files: true
          if-no-files-found: error
