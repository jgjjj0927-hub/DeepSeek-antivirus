<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f12"/>
      <stop offset="100%" stop-color="#123a22"/>
    </linearGradient>
    <linearGradient id="fruit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#eaffea"/>
      <stop offset="70%" stop-color="#c8f7c8"/>
      <stop offset="100%" stop-color="#a8e6a8"/>
    </radialGradient>
  </defs>

  <!-- Фон-круг -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#3ddc84" stroke-width="8"/>

  <!-- Киви (плод) -->
  <ellipse cx="256" cy="270" rx="150" ry="170" fill="url(#fruit)"/>
  <ellipse cx="256" cy="270" rx="120" ry="140" fill="url(#core)"/>

  <!-- Семечки -->
  <g fill="#1a1a1a">
    <ellipse cx="256" cy="200" rx="5" ry="9"/>
    <ellipse cx="210" cy="230" rx="5" ry="9" transform="rotate(-25 210 230)"/>
    <ellipse cx="302" cy="230" rx="5" ry="9" transform="rotate(25 302 230)"/>
    <ellipse cx="190" cy="280" rx="5" ry="9" transform="rotate(-45 190 280)"/>
    <ellipse cx="322" cy="280" rx="5" ry="9" transform="rotate(45 322 280)"/>
    <ellipse cx="200" cy="330" rx="5" ry="9" transform="rotate(-20 200 330)"/>
    <ellipse cx="312" cy="330" rx="5" ry="9" transform="rotate(20 312 330)"/>
    <ellipse cx="256" cy="350" rx="5" ry="9"/>
    <ellipse cx="256" cy="250" rx="5" ry="9"/>
    <ellipse cx="230" cy="290" rx="5" ry="9" transform="rotate(-10 230 290)"/>
    <ellipse cx="282" cy="290" rx="5" ry="9" transform="rotate(10 282 290)"/>
  </g>

  <!-- Птица-киви (силуэт в центре) -->
  <g fill="#0b1f12">
    <ellipse cx="256" cy="255" rx="38" ry="30"/>
    <circle cx="278" cy="240" r="4" fill="#3ddc84"/>
    <path d="M292 252 Q312 256 292 262 Z" fill="#e8a33d"/>
  </g>
</svg>
